<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngược Thời Gian - Flip Clock</title>
    
    <!-- Load Tailwind CSS for modern, responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts: Inter for text, Roboto Mono for the timer numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    
    <!-- Load Flatpickr for 24h datetime input -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* Zinc 950 */
            color: #f4f4f5; /* Zinc 100 */
        }

        /* 
         * FLIP CARD STYLES 
         * Using relative positioning and flexbox to scale with Tailwind sizing.
         */
        .flip-card {
            position: relative;
            perspective: 1000px;
            font-family: 'Roboto Mono', monospace;
            background-color: #18181b; /* Zinc 900 */
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 8px 10px -6px rgba(0, 0, 0, 0.8);
        }

        /* The horizontal divider in the middle */
        .flip-card::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(0, 0, 0, 0.7);
            margin-top: -1px;
            z-index: 10;
        }

        /* Half-card styling for the fold effect */
        .half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background-color: #27272a; /* Zinc 800 */
            backface-visibility: hidden;
            transform-style: preserve-3d;
        }

        .half.top {
            top: 0;
            border-radius: 0.5rem 0.5rem 0 0;
            transform-origin: bottom;
        }

        .half.bottom {
            bottom: 0;
            border-radius: 0 0 0.5rem 0.5rem;
            transform-origin: top;
        }

        /* The text spans 200% of the half-card height to center properly */
        .half span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e4e4e7; /* Zinc 200 */
        }

        .half.top span { top: 0; }
        .half.bottom span { bottom: 0; }

        /* Animation classes */
        .top-flip {
            z-index: 2;
            animation: flipTop 0.4s ease-in forwards;
        }

        .bottom-flip {
            z-index: 2;
            transform: rotateX(90deg);
            animation: flipBottom 0.4s ease-out 0.4s forwards;
        }

        @keyframes flipTop {
            0% { transform: rotateX(0deg); filter: brightness(1); }
            100% { transform: rotateX(-90deg); filter: brightness(0.4); }
        }

        @keyframes flipBottom {
            0% { transform: rotateX(90deg); filter: brightness(0.4); }
            100% { transform: rotateX(0deg); filter: brightness(1); }
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #3b82f6; /* Blue 500 */
        }
    </style>
</head>

<body class="min-h-screen relative flex flex-col items-center justify-center p-4 pb-20 bg-gradient-to-br from-zinc-900 to-black">
    
    <div class="max-w-4xl w-full flex flex-col items-center gap-10 z-10">
        
        <!-- Header -->
        <div class="text-center space-y-3">
            <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                Đếm Ngược Thời Gian
            </h1>
            <p class="text-zinc-400 text-sm md:text-base">Nhập một mốc thời gian trong tương lai để bắt đầu</p>
        </div>

        <!-- Inputs & Control -->
        <div class="flex flex-col sm:flex-row items-center gap-4 bg-zinc-800/50 p-6 rounded-2xl border border-zinc-700/50 backdrop-blur-sm w-full max-w-lg">
            <input 
                type="text" 
                id="target-time" 
                placeholder="Chọn ngày và giờ..."
                class="flex-1 w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 text-zinc-100 placeholder-zinc-500 transition-all cursor-pointer"
            >
            <button 
                id="start-btn" 
                class="w-full sm:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition-colors shadow-lg shadow-blue-900/20 active:scale-95"
            >
                Bắt đầu
            </button>
        </div>

        <!-- Countdown Displays -->
        <div class="flex flex-wrap items-center justify-center gap-3 md:gap-6 w-full">
            
            <div class="flex flex-col items-center gap-3">
                <div id="card-months" class="flip-card w-14 h-20 md:w-24 md:h-36 text-3xl md:text-6xl font-bold"></div>
                <span class="text-[10px] md:text-sm font-medium text-zinc-400 uppercase tracking-wider">Tháng</span>
            </div>

            <div class="flex flex-col items-center gap-3">
                <div id="card-days" class="flip-card w-14 h-20 md:w-24 md:h-36 text-3xl md:text-6xl font-bold"></div>
                <span class="text-[10px] md:text-sm font-medium text-zinc-400 uppercase tracking-wider">Ngày</span>
            </div>

            <div class="flex flex-col items-center gap-3">
                <div id="card-hours" class="flip-card w-14 h-20 md:w-24 md:h-36 text-3xl md:text-6xl font-bold"></div>
                <span class="text-[10px] md:text-sm font-medium text-zinc-400 uppercase tracking-wider">Giờ</span>
            </div>

            <div class="flex flex-col items-center gap-3">
                <div id="card-minutes" class="flip-card w-14 h-20 md:w-24 md:h-36 text-3xl md:text-6xl font-bold"></div>
                <span class="text-[10px] md:text-sm font-medium text-zinc-400 uppercase tracking-wider">Phút</span>
            </div>

            <div class="flex flex-col items-center gap-3">
                <div id="card-seconds" class="flip-card w-14 h-20 md:w-24 md:h-36 text-3xl md:text-6xl font-bold"></div>
                <span class="text-[10px] md:text-sm font-medium text-zinc-400 uppercase tracking-wider">Giây</span>
            </div>

        </div>

        <!-- Alert Message -->
        <div id="message-box" class="hidden w-full max-w-lg px-6 py-4 bg-green-500/20 border border-green-500/30 text-green-400 rounded-xl font-medium text-center animate-pulse">
            Đã đến thời gian đích!
        </div>

    </div>

    <!-- Footer Section -->
    <footer class="absolute bottom-6 w-full left-0 text-center text-zinc-500/80 text-xs md:text-sm font-medium tracking-wide px-4 z-0">
        Dlk Edu Tech - Phát triển bởi tranhongdan@tranphudlk.edu.vn
    </footer>

    <script>
        let intervalId = null;
        let targetDate = null;
        let fpInstance = null;
        const STORAGE_KEY = 'countdownTargetTime';

        // Pre-fill cards with 00
        function initFlipCards() {
            const cards = document.querySelectorAll('.flip-card');
            cards.forEach(card => {
                card.innerHTML = `
                    <div class="half top"><span>00</span></div>
                    <div class="half bottom"><span>00</span></div>
                `;
                card.setAttribute('data-value', '00');
            });
        }

        // Render card flip animation if value changed
        function renderFlipCard(element, newValue) {
            const newStr = String(newValue).padStart(2, '0');
            const currentStr = element.getAttribute('data-value') || '00';

            if (newStr === currentStr) return;

            element.setAttribute('data-value', newStr);
            element.innerHTML = `
                <div class="half top"><span>${newStr}</span></div>
                <div class="half bottom"><span>${currentStr}</span></div>
                <div class="half top top-flip"><span>${currentStr}</span></div>
                <div class="half bottom bottom-flip"><span>${newStr}</span></div>
            `;
        }

        // Compute remaining time considering month/day variances
        function calculateDiff(futureDate) {
            const now = new Date();
            const diffMs = futureDate.getTime() - now.getTime();

            if (diffMs <= 0) {
                return { isFinished: true, m: 0, d: 0, h: 0, min: 0, s: 0 };
            }

            let m = futureDate.getMonth() - now.getMonth() + (12 * (futureDate.getFullYear() - now.getFullYear()));
            let d = futureDate.getDate() - now.getDate();
            let h = futureDate.getHours() - now.getHours();
            let min = futureDate.getMinutes() - now.getMinutes();
            let s = futureDate.getSeconds() - now.getSeconds();

            // Cascading borrows
            if (s < 0) { s += 60; min--; }
            if (min < 0) { min += 60; h--; }
            if (h < 0) { h += 24; d--; }
            if (d < 0) {
                const prevMonth = new Date(futureDate.getFullYear(), futureDate.getMonth(), 0);
                d += prevMonth.getDate();
                m--;
            }
            if (m < 0) m = 0;

            return { isFinished: false, m, d, h, min, s };
        }

        // Timer Tick
        function updateCountdown() {
            if (!targetDate) return;

            const timeData = calculateDiff(targetDate);

            renderFlipCard(document.getElementById('card-months'), timeData.m);
            renderFlipCard(document.getElementById('card-days'), timeData.d);
            renderFlipCard(document.getElementById('card-hours'), timeData.h);
            renderFlipCard(document.getElementById('card-minutes'), timeData.min);
            renderFlipCard(document.getElementById('card-seconds'), timeData.s);

            if (timeData.isFinished) {
                clearInterval(intervalId);
                const messageBox = document.getElementById('message-box');
                messageBox.classList.remove('hidden');
                messageBox.classList.replace('bg-red-500/20', 'bg-green-500/20');
                messageBox.classList.replace('border-red-500/30', 'border-green-500/30');
                messageBox.classList.replace('text-red-400', 'text-green-400');
                messageBox.innerText = "Đã đến thời gian đích!";
                localStorage.removeItem(STORAGE_KEY); // Clear finished target
            }
        }

        function startCountdown(dateObj) {
            const messageBox = document.getElementById('message-box');
            
            // Validate future date
            if (dateObj.getTime() <= new Date().getTime()) {
                messageBox.classList.remove('hidden');
                messageBox.classList.replace('bg-green-500/20', 'bg-red-500/20');
                messageBox.classList.replace('border-green-500/30', 'border-red-500/30');
                messageBox.classList.replace('text-green-400', 'text-red-400');
                messageBox.innerText = "Vui lòng chọn một thời gian trong tương lai!";
                return;
            }

            // Hide message box
            messageBox.classList.add('hidden');
            
            targetDate = dateObj;
            
            // Save to localStorage
            localStorage.setItem(STORAGE_KEY, targetDate.getTime().toString());

            if (intervalId) clearInterval(intervalId);
            updateCountdown(); // Call immediately
            intervalId = setInterval(updateCountdown, 1000); // Tick every second
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            if (!fpInstance || fpInstance.selectedDates.length === 0) {
                const inputEl = document.getElementById('target-time');
                inputEl.classList.add('border-red-500');
                setTimeout(() => inputEl.classList.remove('border-red-500'), 1500);
                return;
            }
            startCountdown(fpInstance.selectedDates[0]);
        });

        // Setup on load
        window.addEventListener('DOMContentLoaded', () => {
            initFlipCards();
            
            fpInstance = flatpickr("#target-time", {
                enableTime: true,
                dateFormat: "d/m/Y H:i",
                time_24hr: true
            });

            // Restore from localStorage
            const savedTime = localStorage.getItem(STORAGE_KEY);
            if (savedTime) {
                const savedDate = new Date(parseInt(savedTime, 10));
                // Only auto-resume if the time is still in the future
                if (savedDate.getTime() > new Date().getTime()) {
                    fpInstance.setDate(savedDate);
                    startCountdown(savedDate);
                } else {
                    localStorage.removeItem(STORAGE_KEY);
                }
            }
        });
    </script>
</body>
</html>
